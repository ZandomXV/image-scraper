name: Image Scraper

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search Bing Images for this term (leave URLs empty if using this)'
        required: false
        type: string
      urls:
        description: 'Comma-separated URLs to scrape (leave empty if using search)'
        required: false
        type: string
      max_images:
        description: 'Maximum total images (default: 500)'
        required: false
        type: number
        default: 500
      crawl_depth:
        description: 'How many link levels to follow (0 = just the page)'
        required: false
        type: number
        default: 1
      max_pages:
        description: 'Max pages to crawl per URL (default: 40)'
        required: false
        type: number
        default: 40

jobs:
  scrape-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run image scraper
        env:
          SEARCH_QUERY: ${{ inputs.search_query }}
          URLS: ${{ inputs.urls }}
          MAX_IMAGES: ${{ inputs.max_images }}
          CRAWL_DEPTH: ${{ inputs.crawl_depth }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python scraper.py

      - name: Check results
        run: |
          mkdir -p downloaded_images
          count=$(find downloaded_images -type f | wc -l)
          echo "Image files found: $count"
          if [ "$count" -eq 0 ]; then
            echo "No images were found for the provided URL(s)." > downloaded_images/NO_IMAGES_FOUND.txt
          fi

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-images
          path: downloaded_images/
          retention-days: 7
