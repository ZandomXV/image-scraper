name: Image Scraper

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated list of URLs to scrape for images'
        required: true
        type: string
      max_images:
        description: 'Maximum number of images to scrape per URL (default: 500)'
        required: false
        type: number
        default: 500

jobs:
  scrape-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run image scraper
        env:
          URLS: ${{ inputs.urls }}
          MAX_IMAGES: ${{ inputs.max_images }}
        run: python scraper.py

      - name: Create zip archive
        run: |
          mkdir -p downloaded_images
          count=$(find downloaded_images -type f | wc -l)
          echo "Image files found: $count"
          if [ "$count" -eq 0 ]; then
            echo "No images were scraped. Adding a note file so the archive is still produced."
            echo "No images were found for the provided URL(s)." > downloaded_images/NO_IMAGES_FOUND.txt
          fi
          cd downloaded_images
          zip -r ../images.zip .

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-images
          path: images.zip
          retention-days: 7
